<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Start Your Project — AI Intake Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #10b981;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 20px;
    }
    .container {
      width: 100%; max-width: 640px; background: var(--card);
      border: 1px solid var(--border); border-radius: 16px;
      padding: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p.sub { margin: 0 0 24px; color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
    .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
    @media (max-width: 520px) { .choice-grid { grid-template-columns: 1fr; } }
    .choice-btn {
      display: flex; flex-direction: column; align-items: flex-start;
      padding: 18px; border-radius: 12px; border: 1px solid var(--border);
      background: #0f172a; color: var(--text); text-decoration: none;
      cursor: pointer; transition: 0.2s; text-align: left;
    }
    .choice-btn:hover { border-color: var(--accent); transform: translateY(-2px); }
    .choice-btn strong { font-size: 1.05rem; margin-bottom: 6px; display: block; }
    .choice-btn span { font-size: 0.85rem; color: var(--muted); line-height: 1.4; }
    .badge {
      display: inline-block; font-size: 0.72rem; font-weight: 600;
      padding: 3px 8px; border-radius: 99px; margin-bottom: 10px;
      background: rgba(59,130,246,0.15); color: #60a5fa;
    }
    .badge.phone { background: rgba(16,185,129,0.15); color: #34d399; }

    /* Chat Interface */
    #chat-box { display: none; border-top: 1px solid var(--border); padding-top: 20px; }
    .messages {
      height: 300px; overflow-y: auto; display: flex; flex-direction: column;
      gap: 12px; padding-right: 6px; margin-bottom: 14px;
    }
    .msg {
      max-width: 85%; padding: 12px 15px; border-radius: 12px;
      font-size: 0.94rem; line-height: 1.45;
    }
    .msg.ai { background: #0f172a; border: 1px solid var(--border); align-self: flex-start; }
    .msg.user { background: var(--accent); color: white; align-self: flex-end; }
    .input-row { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: #0f172a; color: var(--text); font-size: 0.95rem; outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button.action {
      padding: 0 16px; border-radius: 10px; border: none; font-weight: 600;
      cursor: pointer; background: var(--accent); color: white; transition: 0.15s;
    }
    button.action:hover { background: var(--accent-hover); }
    button.mic { background: #334155; font-size: 1.1rem; }
    button.mic.listening { background: #ef4444; animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: 0.6; } }
    .voice-toggle {
      display: flex; align-items: center; gap: 6px; font-size: 0.82rem;
      color: var(--muted); margin-bottom: 10px; cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Tell Us About Your Project</h1>
  <p class="sub">Choose how you prefer to share what you need built. Both options take about 2 minutes and send your project brief straight to our developer.</p>

  <!-- Dual Choice Cards -->
  <div class="choice-grid">
    <button class="choice-btn" onclick="startOnline()">
      <span class="badge">Chat or Browser Mic</span>
      <strong>Interact Online</strong>
      <span>Type or speak directly on this page with our guided AI intake assistant.</span>
    </button>

    <a id="phone-link" class="choice-btn" href="tel:+10000000000">
      <span class="badge phone">24/7 Voice Line</span>
      <strong>Call by Phone</strong>
      <span id="phone-display">Tap to call our AI phone assistant and describe your project aloud.</span>
    </a>
  </div>

  <!-- Online Guided Intake -->
  <div id="chat-box">
    <label class="voice-toggle">
      <input type="checkbox" id="tts-toggle" /> Read AI questions aloud
    </label>
    <div class="messages" id="messages"></div>
    <div class="input-row" id="input-controls">
      <button class="action mic" id="mic-btn" title="Speak answer" onclick="toggleMic()">🎤</button>
      <input type="text" id="user-input" placeholder="Type or click mic to speak..." onkeydown="if(event.key==='Enter') sendAnswer()" />
      <button class="action" onclick="sendAnswer()">Send</button>
    </div>
  </div>
</div>

<script>
  // ================= CONFIGURATION =================
  const CONFIG = {
    WEB3FORMS_KEY: "7393fec3-3022-4eea-bdef-224842265d47",
    PHONE_NUMBER: "+15551234567",          // Replace with your Vapi number in Step 3
    PHONE_LABEL: "Call (555) 123-4567 — Speak directly with our AI assistant."
  };
  // =================================================

  document.getElementById("phone-link").href = `tel:${CONFIG.PHONE_NUMBER}`;
  document.getElementById("phone-display").textContent = CONFIG.PHONE_LABEL;

  const STEPS = [
    {
      key: "objective",
      question: "Hi there! In your own words, what are you hoping to build or get done on the web?"
    },
    {
      key: "context",
      question: "Got it. Who is this website or app for, and what is the main goal you want visitors to take?"
    },
    {
      key: "constraints",
      question: "Do you have a target launch timeline or rough budget range in mind?"
    },
    {
      key: "materials",
      question: "Do you already have a domain, branding, or example sites you like, or are we starting from scratch?"
    },
    {
      key: "contact",
      question: "Last step—what is your name and best email (or phone number) so our developer can follow up with you?"
    }
  ];

  let currentStep = 0;
  let answers = {};
  let started = false;

  function addMessage(text, sender) {
    const box = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = `msg ${sender}`;
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;

    if (sender === "ai" && document.getElementById("tts-toggle").checked && "speechSynthesis" in window) {
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
    }
  }

  function startOnline() {
    document.getElementById("chat-box").style.display = "block";
    if (!started) {
      started = true;
      addMessage(STEPS[0].question, "ai");
    }
    document.getElementById("user-input").focus();
  }

  async function sendAnswer() {
    const input = document.getElementById("user-input");
    const val = input.value.trim();
    if (!val) return;

    addMessage(val, "user");
    answers[STEPS[currentStep].key] = val;
    input.value = "";
    currentStep++;

    if (currentStep < STEPS.length) {
      setTimeout(() => addMessage(STEPS[currentStep].question, "ai"), 350);
    } else {
      document.getElementById("input-controls").style.display = "none";
      addMessage("Thanks! Packaging your project brief and sending it to our developer now...", "ai");
      await submitToEmail();
    }
  }

  async function submitToEmail() {
    const payload = {
      access_key: CONFIG.WEB3FORMS_KEY,
      subject: `New Web Dev Inquiry (Online) — ${answers.contact || "New Lead"}`,
      from_name: "AI Project Intake Portal",
      Channel: "Online Web Portal",
      "1_Core_Objective": answers.objective,
      "2_Audience_and_Goal": answers.context,
      "3_Timeline_and_Budget": answers.constraints,
      "4_Existing_Materials": answers.materials,
      "5_Client_Contact": answers.contact
    };

    try {
      const res = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.success) {
        addMessage("✅ All sent! Your project details are in our developer's inbox. Expect a reply soon.", "ai");
      } else {
        addMessage("⚠️ Something went wrong sending the form. Please check your Web3Forms key or call our phone line above.", "ai");
      }
    } catch (err) {
      addMessage("⚠️ Network error while sending. Please try calling our phone line above.", "ai");
    }
  }

  // Browser Speech-to-Text (Web Speech API)
  let recognition = null;
  let isListening = false;
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = false;

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      document.getElementById("user-input").value = transcript;
      sendAnswer();
    };
    recognition.onend = () => {
      isListening = false;
      document.getElementById("mic-btn").classList.remove("listening");
    };
  }

  function toggleMic() {
    if (!recognition) {
      alert("Voice input isn't supported in this browser—please type your answer instead.");
      return;
    }
    if (isListening) {
      recognition.stop();
    } else {
      isListening = true;
      document.getElementById("mic-btn").classList.add("listening");
      recognition.start();
    }
  }
</script>
</body>
</html>
